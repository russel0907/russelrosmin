<!doctype html>
<html lang="en">
<head>
  <title>Admin Login | Russel Rosmin</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="images/favicon.svg" type="Icon">
  <style>
    :root {
      --primary: #1a1a2e;
      --accent: #e94560;
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #333;
      --text-light: #888;
      --border: #e0e0e0;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      margin: 20px;
    }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .login-card p { color: var(--text-light); margin-bottom: 24px; font-size: 0.9rem; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #2d2d4e; }
    .error-msg {
      display: none;
      background: #fde8e8;
      color: #c0392b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
    }
    .back-link { margin-top: 20px; text-align: center; font-size: 0.8rem; }
    .back-link a { color: var(--text-light); text-decoration: none; }
    .back-link a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 Admin Login</h1>
    <p>Enter your password to manage your resume</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
      <div class="error-msg" id="loginError">Incorrect password. Please try again.</div>
    </form>
    <div class="back-link">
      <a href="index.html">← Back to website</a>
    </div>
  </div>

  <script>
    const DEFAULT_PASSWORD = 'admin';
    
    function getStoredPassword() {
      return localStorage.getItem('resume_admin_password') || DEFAULT_PASSWORD;
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      
      if (password === getStoredPassword()) {
        sessionStorage.setItem('resume_admin_logged_in', 'true');
        window.location.href = 'admin-dashboard.html';
      } else {
        errorEl.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });

    if (sessionStorage.getItem('resume_admin_logged_in') === 'true') {
      window.location.href = 'admin-dashboard.html';
    }
  </script>
</body>
</html>
